# ---------------------------------------------------------------------------
# Development stack. Nothing here is required to run Coldwire — it exists so a
# machine without PHP installed can still bring the board up:
#
#   docker compose up -d
#   docker compose run --rm app php bin/console install
#   open http://127.0.0.1:8080
#
# The database is whatever DB_HOST in .env points at. `host.docker.internal`
# resolves to the host machine, so an existing MySQL — installed locally or
# running in another container that publishes a port — is reached without
# touching it.
#
# No database of your own? Start the bundled one alongside this file:
#
#   docker compose -f docker-compose.yml -f docker-compose.db.yml up -d
#
# For production, serve /public with Apache or nginx + PHP-FPM as described in
# the README.
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    ports:
      # The published port is a variable, so the board can move without editing
      # this file:  make up PORT=8081  (or set APP_PORT in .env to make it stick).
      # Only the left-hand side changes; inside the container it is always 8080.
      - "${APP_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: php -S 0.0.0.0:8080 -t /app/public /app/public/router.php

  # Documentation server. Behind a profile, so it never starts with a plain
  # `docker compose up` and never counts as an orphan on other commands:
  #
  #   docker compose --profile docs up -d docs
  #   open http://127.0.0.1:8100
  #
  # The project is mounted read-only; the server renders /docs and rebuilds on
  # every change. No Python, pip or mkdocs on the host is involved.
  docs:
    image: squidfunk/mkdocs-material:latest
    profiles: ["docs"]
    working_dir: /docs
    volumes:
      - .:/docs:ro
    ports:
      - "${DOCS_PORT:-8100}:8000"
    command: serve --dev-addr 0.0.0.0:8000
