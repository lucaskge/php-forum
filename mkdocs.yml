# ---------------------------------------------------------------------------
# Optional. The documentation in /docs is plain Markdown and reads fine in any
# editor or on a code host; this file only exists so it can also be built into
# a browsable site:
#
#   pip install mkdocs mkdocs-material
#   mkdocs serve
#
# Or with no Python on the host at all:
#
#   docker compose --profile docs up -d docs
#   open http://127.0.0.1:8100
# ---------------------------------------------------------------------------

site_name: Coldwire
site_description: A server-rendered PHP forum with no JavaScript.

repo_url: https://github.com/lucaskge/php-forum
repo_name: lucaskge/php-forum
edit_uri: edit/master/docs/
copyright: 'Coldwire 1.0.0 &middot; <a href="https://github.com/lucaskge/php-forum">source on GitHub</a>'
docs_dir: docs

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/git-alt
  palette:
    # Light, unconditionally. These entries deliberately carry no `media:` key:
    # with one, Material follows the reader's operating system, so anyone on a
    # dark desktop lands on the dark scheme no matter which entry comes first.
    # The first entry with no media query is simply the default; the toggle is
    # there for anyone who wants the other one, and their choice is remembered.
    - scheme: default
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - scheme: slate
      primary: blue grey
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  features:
    # Top-level sections become tabs across the header, so the eight areas of
    # the documentation are one click apart instead of a scroll apart.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

# The board's own palette, so the two look like one product.
extra_css:
  - assets/coldwire.css

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  # "Last updated" on every page. Falls back to the build date for a file that
  # is not committed yet, so an uncommitted draft never breaks the build.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      enable_creation_date: false
  - minify:
      minify_html: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lucaskge/php-forum
      name: The source on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
